<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>印章合成</title>
    <link rel="stylesheet" href="./styles.css?v=20261021-1" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <i data-lucide="stamp"></i>
          </div>
          <div>
            <h1>印章合成</h1>
            <p id="statusText" aria-live="polite">尚未上傳圖片</p>
          </div>
        </div>

        <div class="top-actions">
          <button class="secondary-button" type="button" data-upload-trigger>
            <i data-lucide="image-up"></i>
            <span>選擇圖片</span>
          </button>
          <button class="primary-button" id="downloadButton" type="button" disabled>
            <i data-lucide="download"></i>
            <span>下載</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" aria-label="編輯控制">
          <section class="control-group">
            <h2>圖片</h2>
            <div class="upload-box" id="dropZone">
              <div class="upload-copy">
                <i data-lucide="image"></i>
                <span id="fileName">尚未選擇</span>
              </div>
              <button class="secondary-button" type="button" data-upload-trigger>
                <i data-lucide="upload"></i>
                <span>上傳</span>
              </button>
            </div>
            <input id="fileInput" type="file" accept="image/*" />
          </section>

          <section class="control-group">
            <div class="range-heading">
              <h2><label for="brightnessInput">底圖明暗度</label></h2>
              <output id="brightnessValue" for="brightnessInput">100%</output>
            </div>
            <input id="brightnessInput" class="range-input" type="range" min="0" max="200" value="100" disabled />
            <button id="resetBrightness" class="secondary-button" type="button" disabled>重設亮度</button>
          </section>
          <section class="control-group">
            <h2>局部馬賽克</h2>
            <button id="mosaicToggle" class="secondary-button" type="button" aria-pressed="false" disabled>框選馬賽克</button>
            <p id="mosaicHelp" class="help-text">開啟後，在圖片上拖曳框選，可新增多個區域。按 Esc 取消框選。</p>
            <div class="range-heading">
              <label for="mosaicSize">格子大小（原圖像素）</label>
              <output id="mosaicSizeValue" for="mosaicSize">20 px</output>
            </div>
            <input id="mosaicSize" class="range-input" type="range" min="4" max="100" value="20" disabled />
            <div class="edit-actions">
              <button id="undoEdit" class="secondary-button" type="button" disabled>撤銷</button>
              <button id="clearMosaic" class="secondary-button" type="button" disabled>清除馬賽克</button>
            </div>
            <p id="regionCount" class="help-text" aria-live="polite">尚未框選區域</p>
          </section>

          <section class="control-group">
            <h2>印章</h2>
            <div class="stamp-grid" id="stampGrid"></div>
          </section>

          <section class="control-group">
            <div class="range-heading">
              <h2>大小</h2>
              <output id="scaleValue" for="scaleInput">42%</output>
            </div>
            <input
              id="scaleInput"
              class="range-input"
              type="range"
              min="12"
              max="90"
              value="42"
              step="1"
            />
          </section>

          <section class="control-group">
            <div class="range-heading">
              <h2>角度</h2>
              <output id="rotationValue" for="rotationInput">-15°</output>
            </div>
            <input
              id="rotationInput"
              class="range-input"
              type="range"
              min="-180"
              max="180"
              value="-15"
              step="1"
            />
          </section>

          <section class="control-group">
            <div class="range-heading">
              <h2>透明度</h2>
              <output id="opacityValue" for="opacityInput">100%</output>
            </div>
            <input
              id="opacityInput"
              class="range-input"
              type="range"
              min="0"
              max="100"
              value="100"
              step="1"
            />
          </section>
        </aside>

        <section class="stage" aria-label="圖片預覽">
          <div class="empty-state" id="emptyState">
            <i data-lucide="image-up"></i>
            <strong>尚未上傳圖片</strong>
            <button class="primary-button" type="button" data-upload-trigger>
              <i data-lucide="upload"></i>
              <span>選擇圖片</span>
            </button>
          </div>

          <div class="canvas-frame" id="canvasFrame" hidden>
            <canvas id="resultCanvas" aria-label="底圖與印章預覽" aria-describedby="mosaicHelp"></canvas>
            <div id="selectionBox" hidden></div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./script.js?v=20261021-1"></script>
  </body>
</html>
